<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="utf-8">
    <title>Giriş Yap</title>
</head>

<body>
    <h1>Giriş Yap</h1>
    {% if hata %}<p>{{ hata }}</p>{% endif %}
    <form method="post">
        <label>E-posta <input type="email" name="e_posta" required></label>
        <label>Parola <input type="password" name="parola" required></label>
        <button type="submit">Giriş Yap</button>
    </form>
    <p><a href="{{ url_for('kayıt_ekranı') }}">Hesabın yok mu? Kayıt ol</a></p>
</body>

</html>
