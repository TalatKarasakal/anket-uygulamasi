{% extends "taban.html" %}
{% block başlık %}{{ anket.başlık }} — Ayarlar{% endblock %}
{% block içerik %}
<h1>Anket Ayarları</h1>
<form method="post">
    <p><label>Başlık <input type="text" name="başlık" maxlength="50" value="{{ anket.başlık }}" required></label></p>
    <p><label>Açıklama <textarea name="açıklama">{{ anket.açıklama or "" }}</textarea></label></p>
    <p><label><input type="checkbox" name="anonim_mi" {% if anket.anonim_mi %}checked{% endif %}> Anonim</label></p>
    <p><label><input type="checkbox" name="herkese_açık_mı" {% if anket.herkese_açık_mı %}checked{% endif %}> Herkese açık</label></p>
    <p><label><input type="checkbox" name="açık_uçlu_izinli_mi" {% if anket.açık_uçlu_izinli_mi %}checked{% endif %}> Açık uçlu sorulara izin ver</label></p>
    <p><label><input type="checkbox" name="evet_hayır_izinli_mi" {% if anket.evet_hayır_izinli_mi %}checked{% endif %}> Evet / Hayır sorularına izin ver</label></p>
    <p><label><input type="checkbox" name="ölçek_izinli_mi" {% if anket.ölçek_izinli_mi %}checked{% endif %}> Ölçek sorularına izin ver</label></p>
    <p><label><input type="checkbox" name="çoktan_seçmeli_izinli_mi" {% if anket.çoktan_seçmeli_izinli_mi %}checked{% endif %}> Çoktan seçmeli sorulara izin ver</label></p>
    <fieldset>
        <legend>Süre Ayarı</legend>
        <p>
            <label>
                <input type="radio" name="süre_tipi" value="süre_yok" {% if not anket.son_tarih and not anket.süre_gün %}checked{% endif %}>
                Süre yok
            </label>
        </p>
        <p>
            <label>
                <input type="radio" name="süre_tipi" value="son_tarih" {% if anket.son_tarih and not anket.süre_gün %}checked{% endif %}>
                Son tarih:
            </label>
            <input type="datetime-local" name="son_tarih" value="{{ anket.son_tarih.strftime('%Y-%m-%dT%H:%M') if anket.son_tarih else '' }}">
        </p>
        <p>
            <label>
                <input type="radio" name="süre_tipi" value="süre_gün" {% if anket.süre_gün %}checked{% endif %}>
                Gün sayısı:
            </label>
            <input type="number" name="süre_gün" min="1" value="{{ anket.süre_gün or '' }}">
        </p>
    </fieldset>

    <button type="submit">Kaydet</button>

</form>

<p><a href="{{ url_for('anket_duzenle', anket_kimlik=anket.kimlik) }}">Ankete dön</a></p>
{% endblock %}
